<header class="site-header">
  <a class="brand" routerLink="/">
    <span class="brand-mark">RG</span>
    <span>Roadmap Generator</span>
  </a>

  <nav class="main-nav" aria-label="Main navigation">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Explore</a>
    <a *ngIf="auth.isAuthenticated" routerLink="/profile" routerLinkActive="active">My profile</a>
    <a *ngIf="auth.isAdmin" routerLink="/admin/tracks" routerLinkActive="active">Admin</a>
  </nav>

  <div class="account-actions" *ngIf="user$ | async as user; else guestActions">
    <span class="user-name">{{ user.name }}</span>
    <button class="button button-ghost button-small" type="button" (click)="logout()">Log out</button>
  </div>

  <ng-template #guestActions>
    <div class="account-actions">
      <a class="button button-ghost button-small" routerLink="/login">Log in</a>
      <a class="button button-primary button-small" routerLink="/register">Create account</a>
    </div>
  </ng-template>
</header>

<main class="site-main">
  <router-outlet></router-outlet>
</main>

<footer class="site-footer">
  <span>RG Roadmap Generator</span>
  <span>Rule-based learning paths built from curated content.</span>
</footer>
