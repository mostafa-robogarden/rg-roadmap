<p *ngIf="loading" class="muted">Generating your roadmap…</p>
<div *ngIf="error" class="error-banner">{{ error }}</div>

<section *ngIf="roadmap" class="roadmap-page">
  <div class="page-header">
    <div>
      <p class="eyebrow">{{ roadmap.track.title }} · {{ roadmap.level }}</p>
      <h1>{{ roadmap.title }}</h1>
      <p class="lead">{{ roadmap.description }}</p>
    </div>
    <button class="button button-primary" type="button" [disabled]="saving" (click)="save()">
      {{ saving ? 'Saving…' : (auth.isAuthenticated ? 'Save roadmap' : 'Log in to save') }}
    </button>
  </div>

  <div class="roadmap-line">
    <article *ngFor="let milestone of roadmap.milestones; let index = index" class="milestone card">
      <div class="milestone-number">{{ index + 1 }}</div>
      <div>
        <div class="milestone-heading">
          <h2>{{ milestone.title }}</h2>
          <span *ngIf="milestone.estimatedHours" class="badge">~{{ milestone.estimatedHours }} hours</span>
        </div>
        <p>{{ milestone.description }}</p>
        <div class="resource-list" *ngIf="milestone.resources.length">
          <a *ngFor="let resource of milestone.resources" [href]="resource.url" target="_blank" rel="noopener">{{ resource.label }} ↗</a>
        </div>
      </div>
    </article>
  </div>
</section>
